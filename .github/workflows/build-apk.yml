name: Build & Release EthioHub Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'public/remote-images/**'
      - 'public/remote-videos/**'
      - 'public/manifest.json'
      - '**.md'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.12). Leave blank to auto-increment.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Publish Android APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
          fi
          CLEAN_VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "clean=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm install

      - name: Sync remote media manifest with repository coordinates
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}
        run: node scripts/generate-manifest.mjs

      - name: Build EthioHub web bundle for Android
        env:
          VITE_GITHUB_OWNER: ${{ github.repository_owner }}
          VITE_GITHUB_REPO: ${{ github.event.repository.name }}
          VITE_GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
          VITE_GITHUB_MANIFEST_PATH: public/manifest.json
        run: npm run build

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Initialize & sync Android native project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android version, app name, and permissions
        shell: bash
        run: |
          # Set versionCode and versionName in android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${{ steps.version.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.clean }}\"/" android/app/build.gradle

          # Ensure INTERNET and ACCESS_NETWORK_STATE permissions exist for GitHub raw streaming & offline detection
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "ACCESS_NETWORK_STATE" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />|' "$MANIFEST"
          fi

      - name: Build installable Android APK
        id: apk
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release
          OUT_APK="release/EthioHub-${{ steps.version.outputs.tag }}.apk"

          cd android
          chmod +x gradlew

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            cp app/build/outputs/apk/release/app-release.apk "../$OUT_APK"
          else
            # Signed debug APK installs directly on Android devices with zero extra secrets required
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../$OUT_APK"
          fi

          cd ..
          ls -lh "$OUT_APK"
          echo "apk_path=${OUT_APK}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: EthioHub ${{ steps.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.apk_path }}
          body: |
            ## EthioHub ${{ steps.version.outputs.tag }} (Android APK)

            Tap **EthioHub-${{ steps.version.outputs.tag }}.apk** under **Assets** below to download and install on Android.

            - **GitHub-Only Media Sync**: Automatically loads images from `public/remote-images/` and videos from `public/remote-videos/` via `public/manifest.json`.
            - **No Reinstall Needed for Media Updates**: Upload or replace images/videos on GitHub and the installed app automatically caches and refreshes updates offline.
